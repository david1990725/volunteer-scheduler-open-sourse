
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
:root{--gold:#c8830a;--gold-bg:#c8830a16;--gold-border:#c8830a55}

.stage{
  position:relative;height:420px;overflow:hidden;
  border-radius:16px;background:var(--color-background-secondary);
  display:flex;align-items:center;justify-content:center;
}
.overlay{
  position:absolute;inset:0;border-radius:16px;
  background:rgba(0,0,0,0);
  transition:background .35s ease;
  pointer-events:none;z-index:5;
}
.overlay.dim{background:rgba(0,0,0,.42);pointer-events:all}

.content-hint{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;pointer-events:none;
  transition:opacity .3s;
}
.content-hint.hidden{opacity:0}
.content-hint p{font-size:13px;color:var(--color-text-tertiary);text-align:center;line-height:1.7}

.nav-root{
  position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:10;
  transition:left .5s cubic-bezier(.77,0,.18,1),
             top .5s cubic-bezier(.77,0,.18,1),
             transform .5s cubic-bezier(.77,0,.18,1);
}
.nav-root.anchored{left:72px;top:50%;transform:translate(0,-50%)}

.hub{
  width:72px;height:72px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;z-index:11;
  transition:width .4s cubic-bezier(.77,0,.18,1),
             height .4s cubic-bezier(.77,0,.18,1),
             border-radius .4s ease;
}
.hub:hover{filter:brightness(1.08)}
.hub-icon{font-size:22px;color:#fff;transition:font-size .3s}
.hub-label{font-size:10px;color:rgba(255,255,255,.85);white-space:nowrap}
.hub.pill-mode{width:auto;height:40px;border-radius:99px;padding:0 18px;gap:6px;flex-direction:row}
.hub.pill-mode .hub-icon{font-size:15px}
.hub.pill-mode .hub-label{font-size:13px;font-weight:500}

.nav-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}

/* fan nodes — default layer for initial fan, elevated for switch fan */
.fan-node{
  position:absolute;transform:translate(-50%,-50%);
  transition:left .36s cubic-bezier(.34,1.4,.64,1),
             top .36s cubic-bezier(.34,1.4,.64,1),
             opacity .25s ease;
  opacity:0;pointer-events:none;
}
.fan-node.vis{opacity:1;pointer-events:all}
.fan-node.layer-init{z-index:12}
.fan-node.layer-switch{z-index:9}

.fan-btn{
  padding:8px 16px;border-radius:99px;
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-secondary);
  font-size:13px;font-weight:500;color:var(--color-text-secondary);
  cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
  transition:background .15s,color .15s,border-color .15s;
}
.fan-btn:hover{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
.fan-btn i{font-size:14px;color:var(--gold)}
.fan-btn.current{color:var(--gold);border-color:var(--gold-border);background:var(--gold-bg)}

.fn-pills{
  position:absolute;left:100px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:8px;
  z-index:10;pointer-events:none;opacity:0;
  transition:opacity .3s ease .1s;
}
.fn-pills.vis{opacity:1;pointer-events:all}
.fn-pill{
  padding:8px 14px;border-radius:99px;
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-secondary);
  font-size:12px;font-weight:500;color:var(--color-text-secondary);
  cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
  transform:translateX(-16px);opacity:0;
  transition:background .15s,color .15s,border-color .15s,
             transform .35s cubic-bezier(.34,1.4,.64,1),
             opacity .25s ease;
}
.fn-pills.vis .fn-pill{transform:translateX(0);opacity:1}
.fn-pill:nth-child(1){transition-delay:.05s}
.fn-pill:nth-child(2){transition-delay:.1s}
.fn-pill:nth-child(3){transition-delay:.15s}
.fn-pill:nth-child(4){transition-delay:.2s}
.fn-pill:hover{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
.fn-pill.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
.fn-pill i{font-size:13px}

/* cancel hint above fan during switch */
.switch-cancel{
  position:absolute;z-index:9;
  font-size:11px;color:rgba(255,255,255,.55);
  display:flex;align-items:center;gap:4px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease .3s;
  white-space:nowrap;
}
.switch-cancel.vis{opacity:1;pointer-events:all;cursor:pointer}
.switch-cancel:hover{color:rgba(255,255,255,.9)}

.state-badge{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--color-text-tertiary);
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-tertiary);
  border-radius:99px;padding:4px 12px;white-space:nowrap;z-index:20;
}
</style>

<div class="stage" id="stage">
  <div class="overlay" id="overlay"></div>

  <div class="content-hint" id="contentHint">
    <i class="ti ti-layout-grid" style="font-size:28px;color:var(--color-text-tertiary)" aria-hidden="true"></i>
    <p>選擇團隊後<br>內容將在這裡顯示</p>
  </div>

  <svg class="nav-svg" id="navSvg"></svg>
  <div id="fanNodes" style="position:absolute;inset:0;pointer-events:none"></div>

  <div class="fn-pills" id="fnPills">
    <div class="fn-pill active" data-fn="0"><i class="ti ti-book" aria-hidden="true"></i>義工名冊</div>
    <div class="fn-pill" data-fn="1"><i class="ti ti-table" aria-hidden="true"></i>RAW 資料</div>
    <div class="fn-pill" data-fn="2"><i class="ti ti-radar" aria-hidden="true"></i>技能雷達</div>
    <div class="fn-pill" data-fn="3"><i class="ti ti-calendar-time" aria-hidden="true"></i>排班系統</div>
  </div>

  <div class="switch-cancel" id="switchCancel">
    <i class="ti ti-x" aria-hidden="true"></i> 取消切換
  </div>

  <div class="nav-root" id="navRoot">
    <button class="hub" id="hub" aria-label="選擇團隊">
      <i class="ti ti-layout-grid hub-icon" id="hubIcon" aria-hidden="true"></i>
      <span class="hub-label" id="hubLabel">選擇團隊</span>
    </button>
  </div>

  <div class="state-badge" id="stateBadge">滑鼠移入圓圈展開</div>
</div>

<script>
const stage=document.getElementById('stage');
const overlay=document.getElementById('overlay');
const navRoot=document.getElementById('navRoot');
const hub=document.getElementById('hub');
const hubIcon=document.getElementById('hubIcon');
const hubLabel=document.getElementById('hubLabel');
const fanNodesWrap=document.getElementById('fanNodes');
const fnPills=document.getElementById('fnPills');
const navSvg=document.getElementById('navSvg');
const stateBadge=document.getElementById('stateBadge');
const contentHint=document.getElementById('contentHint');
const switchCancel=document.getElementById('switchCancel');

const teams=[
  {name:'影視團隊',icon:'ti-video'},
  {name:'燈光團隊',icon:'ti-bulb'},
  {name:'舞監團隊',icon:'ti-music'},
  {name:'音控團隊',icon:'ti-microphone'},
];

/* initial fan: spread upward-right from center
   switch fan:  spread rightward from anchored pill position */
const FAN_ANGLES_INIT=[-140,-100,-60,-20];
const FAN_ANGLES_SWITCH=[-80,-40,0,40];
const FAN_R=108;

let STATE='idle'; // idle | fan | settling | anchored | switching
let activeTeam=null;
let fanEls=[],fanLines=[],hoverTimeout=null;

function setStageBadge(t){stateBadge.textContent=t}

function getHubCenter(){
  const sr=stage.getBoundingClientRect();
  const nr=navRoot.getBoundingClientRect();
  return{x:nr.left-sr.left+nr.width/2, y:nr.top-sr.top+nr.height/2};
}

function buildFan(angles, layer, onSelect){
  clearFan();
  const c=getHubCenter();
  teams.forEach((t,i)=>{
    const nd=document.createElement('div');
    nd.className=`fan-node ${layer}`;
    nd.style.left=c.x+'px';
    nd.style.top=c.y+'px';
    const btn=document.createElement('button');
    btn.className='fan-btn';
    if(layer==='layer-switch' && activeTeam===i) btn.classList.add('current');
    btn.innerHTML=`<i class="ti ${t.icon}" aria-hidden="true"></i>${t.name}`;
    nd.appendChild(btn);
    fanNodesWrap.appendChild(nd);
    fanEls.push(nd);
    btn.addEventListener('click',()=>onSelect(i));
    requestAnimationFrame(()=>{
      const rad=(angles[i]-90)*Math.PI/180;
      const tx=c.x+FAN_R*Math.cos(rad);
      const ty=c.y+FAN_R*Math.sin(rad);
      nd.style.left=tx+'px';
      nd.style.top=ty+'px';
      nd.classList.add('vis');
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',c.x);ln.setAttribute('y1',c.y);
      ln.setAttribute('x2',tx);ln.setAttribute('y2',ty);
      ln.setAttribute('stroke','#c8830a44');ln.setAttribute('stroke-width','1');
      navSvg.appendChild(ln);
      fanLines.push(ln);
    });
  });
}

function clearFan(){
  fanEls.forEach(n=>n.remove());
  fanLines.forEach(l=>l.remove());
  fanEls=[];fanLines=[];
}

function collapseFan(cb){
  const c=getHubCenter();
  fanEls.forEach(nd=>{
    nd.style.left=c.x+'px';
    nd.style.top=c.y+'px';
    nd.style.opacity='0';
    nd.style.pointerEvents='none';
  });
  fanLines.forEach(l=>l.style.opacity='0');
  setTimeout(()=>{clearFan();if(cb)cb();},360);
}

/* ── initial select ── */
function selectTeam(idx){
  STATE='settling';
  activeTeam=idx;
  collapseFan(()=>{
    hub.classList.add('pill-mode');
    hubIcon.className=`ti ${teams[idx].icon} hub-icon`;
    hubLabel.textContent=teams[idx].name;
    navRoot.classList.add('anchored');
    setTimeout(()=>{
      fnPills.classList.add('vis');
      contentHint.classList.add('hidden');
      STATE='anchored';
      setStageBadge(`${teams[idx].name} — 點選功能 · 點擊名稱切換團隊`);
    },300);
  });
}

/* ── open switch: overlay + fan from current pill position ── */
function openSwitch(){
  STATE='switching';
  overlay.classList.add('dim');
  fnPills.style.zIndex='4'; // sink behind overlay

  // position cancel hint above the fan origin
  const sr=stage.getBoundingClientRect();
  const nr=navRoot.getBoundingClientRect();
  const hcx=nr.left-sr.left+nr.width/2;
  const hcy=nr.top-sr.top+nr.height/2;
  switchCancel.style.left=hcx+'px';
  switchCancel.style.top=(hcy-FAN_R-36)+'px';
  switchCancel.style.transform='translateX(-50%)';
  switchCancel.classList.add('vis');

  buildFan(FAN_ANGLES_SWITCH, 'layer-switch', switchSelectTeam);
  setStageBadge('切換團隊 — 點選新團隊');
}

/* ── pick new team while switching ── */
function switchSelectTeam(idx){
  switchCancel.classList.remove('vis');
  collapseFan(()=>{
    activeTeam=idx;
    hubIcon.className=`ti ${teams[idx].icon} hub-icon`;
    hubLabel.textContent=teams[idx].name;
    overlay.classList.remove('dim');
    fnPills.style.zIndex='';
    document.querySelectorAll('[data-fn]').forEach(p=>p.classList.remove('active'));
    document.querySelector('[data-fn="0"]').classList.add('active');
    STATE='anchored';
    setStageBadge(`${teams[idx].name} — 點選功能 · 點擊名稱切換團隊`);
  });
}

/* ── cancel switch ── */
function cancelSwitch(){
  switchCancel.classList.remove('vis');
  collapseFan(()=>{
    overlay.classList.remove('dim');
    fnPills.style.zIndex='';
    STATE='anchored';
    setStageBadge(`${teams[activeTeam].name} — 點選功能 · 點擊名稱切換團隊`);
  });
}

/* ── hub hover/click ── */
hub.addEventListener('mouseenter',()=>{
  if(STATE!=='idle') return;
  clearTimeout(hoverTimeout);
  hoverTimeout=setTimeout(()=>{
    if(STATE==='idle'){
      STATE='fan';
      buildFan(FAN_ANGLES_INIT,'layer-init',selectTeam);
      setStageBadge('點選任一團隊');
    }
  },80);
});
hub.addEventListener('mouseleave',()=>{
  if(STATE!=='fan') return;
  clearTimeout(hoverTimeout);
  hoverTimeout=setTimeout(()=>{
    if(STATE==='fan'){
      STATE='idle';
      collapseFan();
      setStageBadge('滑鼠移入圓圈展開');
    }
  },600);
});
fanNodesWrap.addEventListener('mouseenter',()=>clearTimeout(hoverTimeout));
fanNodesWrap.addEventListener('mouseleave',()=>{
  if(STATE!=='fan') return;
  hoverTimeout=setTimeout(()=>{
    if(STATE==='fan'){STATE='idle';collapseFan();setStageBadge('滑鼠移入圓圈展開');}
  },500);
});
hub.addEventListener('click',()=>{
  if(STATE==='idle'){STATE='fan';buildFan(FAN_ANGLES_INIT,'layer-init',selectTeam);setStageBadge('點選任一團隊');return;}
  if(STATE==='anchored'){openSwitch();return;}
});

/* overlay click = cancel */
overlay.addEventListener('click',()=>{if(STATE==='switching')cancelSwitch();});
switchCancel.addEventListener('click',e=>{e.stopPropagation();cancelSwitch();});

/* fn pills */
document.querySelectorAll('[data-fn]').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('[data-fn]').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    const labels=['義工名冊','RAW 資料表單','技能雷達圖','自動排班系統'];
    setStageBadge(`${teams[activeTeam].name} — ${labels[p.dataset.fn]}`);
  });
});
</script>
